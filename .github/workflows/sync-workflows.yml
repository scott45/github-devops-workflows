# SPDX-License-Identifier: Apache-2.0
name: Sync Workflows

on:
  pull_request:
    branches: [ dev ]           # Run this workflow when a PR targeting 'dev' is closed
    types: [ closed ]
  workflow_dispatch:

permissions:
  contents: write               # needed to push branches to target repos
  pull-requests: write          # needed to open PRs on target repos

jobs:
  Sync_All_Repos_Common_Workflows:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'dependabot-preview[bot]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout central workflows repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      # CHANGED: make signer robust for workflow_dispatch (no PR payload)
      - name: Set signer from PR author (event payload)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR_AUTHOR_NAME_FULL=${{ github.event.pull_request.user.login }}" >> $GITHUB_ENV
          else
            echo "PR_AUTHOR_NAME_FULL=${{ github.actor }}" >> $GITHUB_ENV
          fi
          # Email generally isn't available via event payload; use a neutral noreply
          echo "PR_AUTHOR_EMAIL=actions@github.com" >> $GITHUB_ENV

      - name: Prepare central workflow payload
        run: |
          set -euo pipefail
          # Stage central workflows in a temp dir
          if [ ! -d ".github/workflows" ]; then
            echo "No .github/workflows in central repo; nothing to sync."
            exit 0
          fi
          mkdir -p central-wf
          cp -r .github/workflows/* central-wf/

          # Avoid recursive self-sync or repo-specific files (adjust as needed)
          rm -f central-wf/sync-workflows.yml || true
          rm -f central-wf/node.js.yml || true

      # CHANGED: use a fixed branch per repo ("sync-workflows") and reuse/update same PR
      - name: Sync workflows to target repositories
        env:
          REPOS: |
            github-devops-javascript
            github-devops-python
          SPECIFIC_REPOS: ${{ vars.SPECIFIC_REPOS }}
          SPECIFIC_FILES: ${{ vars.SPECIFIC_FILES }}
          PR_REVIEWERS: ${{ vars.PR_REVIEWERS }}
          GH_PAT: ${{ secrets.DEMO_GITHUB_TOKEN }}   # PAT with repo write on targets
        run: |
          set -euo pipefail

          SIGNED_OFF_BY="Signed-off-by: ${{ env.PR_AUTHOR_NAME_FULL }} <${{ env.PR_AUTHOR_EMAIL }}>"
          BRANCH="central-workflows"   # fixed branch name so the same PR is reused

          # Prepare reviewer args
          IFS=',' read -ra REVIEWERS_ARR <<< "${PR_REVIEWERS:-}"
          REVIEWER_ARGS=()
          for r in "${REVIEWERS_ARR[@]}"; do
            [ -n "$r" ] && REVIEWER_ARGS+=(--reviewer "$r")
          done

          # Helper: array contains
          in_array() { local n="$1"; shift; for x in "$@"; do [ "$x" = "$n" ] && return 0; done; return 1; }

          # Parse optional repo/file exclusions
          IFS=',' read -ra SPEC_REPOS_ARR <<< "${SPECIFIC_REPOS:-}"
          IFS=',' read -ra SPEC_FILES_ARR <<< "${SPECIFIC_FILES:-}"

          while read -r repo; do
            [ -z "$repo" ] && continue
            echo "=== Syncing to scott45/${repo} ==="

            # Clone using PAT in the URL
            git clone "https://${{ github.actor }}:${GH_PAT}@github.com/scott45/${repo}.git"
            cd "${repo}"

            # Ensure origin uses tokenized URL for pushes too
            git remote set-url origin "https://${{ github.actor }}:${GH_PAT}@github.com/scott45/${repo}.git"

            # Determine base branch (prefer dev; else default)
            BASE_BRANCH="dev"
            echo "${GH_PAT}" > /tmp/gh_token
            unset GITHUB_TOKEN GH_TOKEN
            gh auth login --with-token < /tmp/gh_token >/dev/null
            if ! git ls-remote --exit-code --heads origin "$BASE_BRANCH" >/dev/null 2>&1; then
              BASE_BRANCH="$(gh repo view "scott45/${repo}" --json defaultBranchRef --jq .defaultBranchRef.name)"
            fi
            echo "Base branch: ${BASE_BRANCH}"

            git fetch origin

            # CHANGED: if fixed branch exists, continue from it; else base on latest base branch
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              git checkout -B "$BRANCH" "origin/${BRANCH}"
            else
              git checkout -B "$BRANCH" "origin/${BASE_BRANCH}"
            fi

            # Copy central workflows (prepared earlier in ../central-wf)
            mkdir -p .github/workflows
            if in_array "${repo}" "${SPEC_REPOS_ARR[@]}"; then
              for f in ../central-wf/*; do
                bn="$(basename "$f")"
                skip=false
                for s in "${SPEC_FILES_ARR[@]}"; do
                  [ -n "$s" ] && [ "$bn" = "$s" ] && { skip=true; break; }
                done
                $skip || cp -f "$f" .github/workflows/
              done
            else
              cp -f ../central-wf/* .github/workflows/
            fi

            git add .github/workflows
            if git diff --cached --quiet; then
              echo "No workflow changes for ${repo}; skipping PR."
              cd ..
              rm -rf "${repo}"
              continue
            fi

            git -c user.name="github-actions" -c user.email="actions@github.com" \
              commit -m "ci: sync workflows from central-workflows ${SIGNED_OFF_BY}"

            # Push updates to the fixed branch
            git push -u origin "$BRANCH"

            # CHANGED: reuse PR if one is already open from this branch
            OPEN_PR_URL="$(gh pr list \
              --repo "scott45/${repo}" \
              --head "$BRANCH" \
              --state open \
              --json url --jq '.[0].url' || true)"

            if [ -n "$OPEN_PR_URL" ]; then
              echo "Updated existing PR: $OPEN_PR_URL"
            else
              # No open PR—create one
              if ! gh pr create \
                --repo "scott45/${repo}" \
                --base "$BASE_BRANCH" \
                --head "$BRANCH" \
                --title "ci: sync workflows from central-workflows" \
                --body "This PR syncs workflows from the central-workflows repository. ${SIGNED_OFF_BY}" \
                "${REVIEWER_ARGS[@]}"; then
                echo "PR may already exist in a non-open state; showing any PR for this head…"
                gh pr view --repo "scott45/${repo}" --head "$BRANCH" --json url --jq .url || true
              fi
            fi

            # cleanup
            rm -f /tmp/gh_token
            cd ..
            rm -rf "${repo}"
          done <<< "${REPOS}"
